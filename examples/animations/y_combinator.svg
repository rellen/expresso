<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 480" width="1180" height="480" font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', serif"><title>The proof that Y g is a fix point of g</title><g id="L0"><g id="L0-Y"><text id="L0-c0" x="139.5" y="70" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">Y</text></g><text id="L0-c2" x="168.5" y="70" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">g</text></g><g id="L1"><g id="L1-def"><g id="L1-head"><text id="L1-c0" x="139.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">(</text><text id="L1-c3" x="196.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">.</text></g><g id="L1-bind"><text id="L1-c1" x="158.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">λ</text><text id="L1-c2" x="177.5" y="142" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">f</text></g><g id="L1-body"><g id="L1-bound"><text id="L1-c8" x="291.5" y="142" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">f</text><text id="L1-c21" x="511.5" y="142" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">f</text></g><g id="L1-body-rest"><text id="L1-c4" x="215.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">(</text><text id="L1-c5" x="234.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">λ</text><text id="L1-c6" x="253.5" y="142" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text id="L1-c7" x="272.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">.</text><text id="L1-c10" x="320.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">(</text><text id="L1-c11" x="339.5" y="142" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text id="L1-c13" x="368.5" y="142" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text id="L1-c14" x="387.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">)</text><text id="L1-c15" x="406.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">)</text><text id="L1-c17" x="435.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">(</text><text id="L1-c18" x="454.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">λ</text><text id="L1-c19" x="473.5" y="142" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text id="L1-c20" x="492.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">.</text><text id="L1-c23" x="540.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">(</text><text id="L1-c24" x="559.5" y="142" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text id="L1-c26" x="588.5" y="142" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text id="L1-c27" x="607.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">)</text><text id="L1-c28" x="626.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">)</text></g></g><g id="L1-close"><text id="L1-c29" x="645.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">)</text></g></g><g id="L1-arg"><text id="L1-c31" x="674.5" y="142" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">g</text></g></g><g id="L2"><g id="L2-bind"><text id="L2-c1" x="158.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">λ</text><text id="L2-c2" x="177.5" y="214" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text></g><g id="L2-bound"><text id="L2-c7" x="263.5" y="214" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text id="L2-c9" x="292.5" y="214" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text></g><g id="L2-arg"><text id="L2-c13" x="359.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">(</text><text id="L2-c14" x="378.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">λ</text><text id="L2-c15" x="397.5" y="214" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text id="L2-c16" x="416.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">.</text><text id="L2-c17" x="435.5" y="214" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">g</text><text id="L2-c19" x="464.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">(</text><text id="L2-c20" x="483.5" y="214" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text id="L2-c22" x="512.5" y="214" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text id="L2-c23" x="531.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">)</text><text id="L2-c24" x="550.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">)</text></g><text id="L2-c0" x="139.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">(</text><text id="L2-c3" x="196.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">.</text><text id="L2-c4" x="215.5" y="214" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">g</text><text id="L2-c6" x="244.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">(</text><text id="L2-c10" x="311.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">)</text><text id="L2-c11" x="330.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">)</text></g><g id="L3"><text id="L3-c0" x="139.5" y="286" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">g</text><text id="L3-c2" x="168.5" y="286" text-anchor="middle" font-size="30" fill="currentColor">(</text><text id="L3-c28" x="617.5" y="286" text-anchor="middle" font-size="30" fill="currentColor">)</text><g id="L3-s1"><text id="L3-c3" x="187.5" y="286" text-anchor="middle" font-size="30" fill="currentColor">(</text><text id="L3-c4" x="206.5" y="286" text-anchor="middle" font-size="30" fill="currentColor">λ</text><text id="L3-c5" x="225.5" y="286" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text id="L3-c6" x="244.5" y="286" text-anchor="middle" font-size="30" fill="currentColor">.</text><text id="L3-c7" x="263.5" y="286" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">g</text><text id="L3-c9" x="292.5" y="286" text-anchor="middle" font-size="30" fill="currentColor">(</text><text id="L3-c10" x="311.5" y="286" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text id="L3-c12" x="340.5" y="286" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text id="L3-c13" x="359.5" y="286" text-anchor="middle" font-size="30" fill="currentColor">)</text><text id="L3-c14" x="378.5" y="286" text-anchor="middle" font-size="30" fill="currentColor">)</text></g><g id="L3-s2"><text id="L3-c16" x="407.5" y="286" text-anchor="middle" font-size="30" fill="currentColor">(</text><text id="L3-c17" x="426.5" y="286" text-anchor="middle" font-size="30" fill="currentColor">λ</text><text id="L3-c18" x="445.5" y="286" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text id="L3-c19" x="464.5" y="286" text-anchor="middle" font-size="30" fill="currentColor">.</text><text id="L3-c20" x="483.5" y="286" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">g</text><text id="L3-c22" x="512.5" y="286" text-anchor="middle" font-size="30" fill="currentColor">(</text><text id="L3-c23" x="531.5" y="286" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text id="L3-c25" x="560.5" y="286" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text id="L3-c26" x="579.5" y="286" text-anchor="middle" font-size="30" fill="currentColor">)</text><text id="L3-c27" x="598.5" y="286" text-anchor="middle" font-size="30" fill="currentColor">)</text></g></g><g id="L4"><text id="L4-c0" x="139.5" y="358" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">g</text><text id="L4-c2" x="168.5" y="358" text-anchor="middle" font-size="30" fill="currentColor">(</text><text id="L4-c6" x="235.5" y="358" text-anchor="middle" font-size="30" fill="currentColor">)</text><g id="L4-s"><text id="L4-c3" x="187.5" y="358" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">Y</text><text id="L4-c5" x="216.5" y="358" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">g</text></g></g><text id="rel1" x="70" y="142" text-anchor="middle" font-size="30" fill="currentColor">=</text><text id="rel2" x="70" y="214" text-anchor="middle" font-size="30" fill="currentColor">→β</text><text id="rel3" x="70" y="286" text-anchor="middle" font-size="30" fill="currentColor">→β</text><text id="rel4" x="70" y="358" text-anchor="middle" font-size="30" fill="currentColor">=β</text><text id="why1" x="820" y="142" text-anchor="start" font-size="22" fill="currentColor">the definition of Y</text><text id="why2" x="820" y="214" text-anchor="start" font-size="22" fill="currentColor">f := g</text><text id="why3" x="820" y="286" text-anchor="start" font-size="22" fill="currentColor">x := λx.g (x x)</text><text id="why4" x="820" y="358" text-anchor="start" font-size="22" fill="currentColor">line 3 =β Y g</text><text id="cap1" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">The claim: Y g is a fix point of g.</text><text id="cap2" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">Unfold Y: replace Y with its definition.</text><text id="cap3" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">β-reduction 1. The redex: λf. … applied to the argument g.</text><text id="cap4" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">λf binds each f in the body.</text><text id="cap5" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">Copy the body down.</text><text id="cap6" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">Put the argument g in the place of each f.</text><text id="cap7" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">β-reduction 2. The redex: λx.g (x x) applied to a copy of itself.</text><text id="cap8" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">λx binds each x in the body.</text><text id="cap9" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">Copy the body down, and make room for the argument.</text><text id="cap10" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">Put the argument in the place of each x.</text><text id="cap11" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">The term inside g ( … ) is line 3, and Y g reduces to line 3.</text><text id="cap12" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">So the term is equal to Y g.</text><text id="cap13" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">Y g =β g (Y g): Y g is a fix point of g.</text></svg>
