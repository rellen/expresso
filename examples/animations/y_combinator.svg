-style="italic">Y</text><text x="216.5" y="358" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">g</text></g></g><g id="M1-body"><g id="M1-f"><text x="291.5" y="142" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">f</text><text x="511.5" y="142" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">f</text></g><g id="M1-bind"><text x="234.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">λ</text><text x="253.5" y="142" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text></g><g id="M1-bound"><text x="339.5" y="142" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text x="368.5" y="142" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text></g><g id="M1-arg"><text x="435.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">(</text><text x="454.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">λ</text><text x="473.5" y="142" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text x="492.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">.</text><text x="540.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">(</text><text x="559.5" y="142" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text x="588.5" y="142" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text x="607.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">)</text><text x="626.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">)</text></g><g id="M1-rest"><text x="215.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">(</text><text x="272.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">.</text><text x="320.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">(</text><text x="387.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">)</text><text x="406.5" y="142" text-anchor="middle" font-size="30" fill="currentColor">)</text></g></g><g id="M1-g1"><text x="674.5" y="142" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">g</text></g><g id="M1-g2"><text x="674.5" y="142" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">g</text></g><g id="M2-g"><text x="215.5" y="214" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">g</text></g><g id="M2-lp"><text x="244.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">(</text></g><g id="M2-x1"><text x="263.5" y="214" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text></g><g id="M2-x2"><text x="292.5" y="214" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text></g><g id="M2-rp"><text x="311.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">)</text></g><g id="M2-a1"><text x="359.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">(</text><text x="378.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">λ</text><text x="397.5" y="214" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text x="416.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">.</text><text x="435.5" y="214" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">g</text><text x="464.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">(</text><text x="483.5" y="214" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text x="512.5" y="214" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text x="531.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">)</text><text x="550.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">)</text></g><g id="M2-a2"><text x="359.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">(</text><text x="378.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">λ</text><text x="397.5" y="214" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text x="416.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">.</text><text x="435.5" y="214" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">g</text><text x="464.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">(</text><text x="483.5" y="214" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text x="512.5" y="214" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">x</text><text x="531.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">)</text><text x="550.5" y="214" text-anchor="middle" font-size="30" fill="currentColor">)</text></g><g id="M3-g"><text x="139.5" y="286" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">g</text></g><g id="M3-lp"><text x="168.5" y="286" text-anchor="middle" font-size="30" fill="currentColor">(</text></g><g id="M3-rp"><text x="617.5" y="286" text-anchor="middle" font-size="30" fill="currentColor">)</text></g><g id="M3-Yg"><text x="139.5" y="70" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">Y</text><text x="168.5" y="70" text-anchor="middle" font-size="30" fill="currentColor" font-style="italic">g</text></g><text id="rel1" x="70" y="142" text-anchor="middle" font-size="30" fill="currentColor">=</text><text id="rel2" x="70" y="214" text-anchor="middle" font-size="30" fill="currentColor">→β</text><text id="rel3" x="70" y="286" text-anchor="middle" font-size="30" fill="currentColor">→β</text><text id="rel4" x="70" y="358" text-anchor="middle" font-size="30" fill="currentColor">=β</text><text id="why1" x="820" y="142" text-anchor="start" font-size="22" fill="currentColor">the definition of Y</text><text id="why2" x="820" y="214" text-anchor="start" font-size="22" fill="currentColor">f := g</text><text id="why3" x="820" y="286" text-anchor="start" font-size="22" fill="currentColor">x := λx.g (x x)</text><text id="why4" x="820" y="358" text-anchor="start" font-size="22" fill="currentColor">line 3 =β Y g</text><text id="cap1" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">The claim: Y g is a fix point of g.</text><text id="cap2" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">Unfold Y: replace Y with its definition.</text><text id="cap3" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">β-reduction 1. The redex: λf. … applied to the argument g.</text><text id="cap4" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">λf binds each f in the body.</text><text id="cap5" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">Copy the body down.</text><text id="cap6" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">Put the argument g in the place of each f.</text><text id="cap7" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">β-reduction 2. The redex: λx.g (x x) applied to a copy of itself.</text><text id="cap8" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">λx binds each x in the body.</text><text id="cap9" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">Copy the body down, and make room for the argument.</text><text id="cap10" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">Put the argument in the place of each x.</text><text id="cap11" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">The term inside g ( … ) is line 3, and Y g reduces to line 3.</text><text id="cap12" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">So the term is equal to Y g.</text><text id="cap13" x="590" y="473.2" text-anchor="middle" font-size="24" fill="currentColor">Y g =β g (Y g): Y g is a fix point of g.</text></svg>
