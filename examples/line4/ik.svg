<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 110 900 330" width="900" height="330" font-size="18" role="img">
  <title>Two-link inverse kinematics with the law of cosines</title>
  <g id="base">
    <line x1="40" y1="400" x2="860" y2="400" stroke="currentColor" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="148" y="330" width="44" height="70" fill="#3b444d"/>
    <circle cx="170" cy="330" r="16" fill="#3b444d" stroke="currentColor"/>
    <text x="170" y="430" font-size="18" text-anchor="middle" fill="currentColor">S · shoulder</text>
  </g>
  <g id="reach">
    <line x1="170" y1="330" x2="456" y2="231" stroke="#e8b83a" stroke-width="3" stroke-dasharray="10 7"/>
    <text x="383" y="320.5" font-size="20" text-anchor="middle" fill="#e8b83a">D = |W − S|</text>
  </g>
  <g id="angle-phi">
