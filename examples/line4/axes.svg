<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-size="18" role="img">
  <title>The world axes of Line 4 and one box with its three faces</title>
  <g id="axis-x">
    <line x1="160" y1="200" x2="262.2" y2="259" stroke="#e23b3b" stroke-width="3"/><polygon points="272.6,265 265.2,253.8 259.2,264.2" fill="#e23b3b"/>
    <text x="294.6" y="287" font-size="22" text-anchor="middle" fill="#e23b3b">+x</text>
  </g>
  <g id="axis-y">
    <line x1="160" y1="200" x2="57.8" y2="259" stroke="#3fbf5a" stroke-width="3"/><polygon points="47.4,265 60.8,264.2 54.8,253.8" fill="#3fbf5a"/>
    <text x="25.4" y="287" font-size="22" text-anchor="middle" fill="#3fbf5a">+y</text>
  </g>
  <g id="axis-z">
    <line x1="160" y1="200" x2="160" y2="82" stroke="#3a7de0" stroke-width="3"/><polygon points="160,70 154,82 166,82" fill="#3a7de0"/>
    <text x="160" y="56" font-size="22" text-anchor="middle" fill="#3a7de0">+z</text>
  </g>
  <g id="angle">
    <text x="160" y="305" font-size="18" text-anchor="middle" fill="currentColor">30° from the horizontal</text>
  </g>
  <g id="face-top">
    <polygon points="470,70 565.3,125 470,180 374.7,125" fill="#3a7de0" stroke="#0e1218" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="470" y="133" font-size="18" text-anchor="middle" fill="#ffffff">top × 1.0</text>
  </g>
  <g id="face-y1">
    <polygon points="374.7,235 470,290 470,180 374.7,125" fill="#3066b8" stroke="#0e1218" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="422.4" y="213" font-size="17" text-anchor="middle" fill="#ffffff">y1 × 0.82</text>
  </g>
  <g id="face-x1">
    <polygon points="565.3,235 470,290 470,180 565.3,125" fill="#234b86" stroke="#0e1218" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="517.6" y="213" font-size="17" text-anchor="middle" fill="#ffffff">x1 × 0.6</text>
  </g>
  <g id="viewer">
    <line x1="645" y1="330" x2="598.5" y2="283.5" stroke="#e8b83a" stroke-width="3"/><polygon points="590,275 594.2,287.7 602.7,279.2" fill="#e8b83a"/>
    <text x="590" y="355" font-size="18" text-anchor="middle" fill="currentColor">the viewer: +x, +y, +z</text>
  </g>
</svg>
