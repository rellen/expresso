<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-size="18">
  <title>Bookings on the floor along x against time</title>
  <g id="axes">
    <line x1="140" y1="440" x2="960" y2="440" stroke="currentColor" stroke-width="2"/>
    <line x1="140" y1="440" x2="140" y2="30" stroke="currentColor" stroke-width="2"/>
    <text x="960" y="494" text-anchor="end" fill="currentColor">x along the floor (m)</text>
    <text x="126" y="26" text-anchor="end" fill="currentColor">time (s)</text>
    <text x="140" y="464" text-anchor="middle" fill="currentColor" font-size="16">0</text>
    <text x="300" y="464" text-anchor="middle" fill="currentColor" font-size="16">2</text>
    <text x="460" y="464" text-anchor="middle" fill="currentColor" font-size="16">4</text>
    <text x="620" y="464" text-anchor="middle" fill="currentColor" font-size="16">6</text>
    <text x="780" y="464" text-anchor="middle" fill="currentColor" font-size="16">8</text>
    <text x="940" y="464" text-anchor="middle" fill="currentColor" font-size="16">10</text>
    <text x="130" y="446" text-anchor="end" fill="currentColor" font-size="16">0</text>
    <text x="130" y="348" text-anchor="end" fill="currentColor" font-size="16">3</text>
    <text x="130" y="251" text-anchor="end" fill="currentColor" font-size="16">6</text>
    <text x="130" y="154" text-anchor="end" fill="currentColor" font-size="16">9</text>
    <text x="130" y="56" text-anchor="end" fill="currentColor" font-size="16">12</text>
  </g>
  <g id="walker-a">
    <rect x="196.0" y="386.4" width="88.0" height="26.0" fill="#5b9be8" fill-opacity="0.45" stroke="#5b9be8"/>
    <rect x="236.0" y="370.1" width="88.0" height="26.0" fill="#5b9be8" fill-opacity="0.45" stroke="#5b9be8"/>
    <rect x="276.0" y="353.9" width="88.0" height="26.0" fill="#5b9be8" fill-opacity="0.45" stroke="#5b9be8"/>
    <rect x="316.0" y="337.6" width="88.0" height="26.0" fill="#5b9be8" fill-opacity="0.45" stroke="#5b9be8"/>
    <rect x="356.0" y="321.4" width="88.0" height="26.0" fill="#5b9be8" fill-opacity="0.45" stroke="#5b9be8"/>
    <rect x="396.0" y="305.1" width="88.0" height="26.0" fill="#5b9be8" fill-opacity="0.45" stroke="#5b9be8"/>
    <rect x="436.0" y="288.9" width="88.0" height="26.0" fill="#5b9be8" fill-opacity="0.45" stroke="#5b9be8"/>
    <rect x="476.0" y="272.6" width="88.0" height="26.0" fill="#5b9be8" fill-opacity="0.45" stroke="#5b9be8"/>
    <rect x="516.0" y="256.4" width="88.0" height="26.0" fill="#5b9be8" fill-opacity="0.45" stroke="#5b9be8"/>
    <rect x="556.0" y="240.1" width="88.0" height="26.0" fill="#5b9be8" fill-opacity="0.45" stroke="#5b9be8"/>
    <rect x="596.0" y="223.9" width="88.0" height="26.0" fill="#5b9be8" fill-opacity="0.45" stroke="#5b9be8"/>
    <rect x="636.0" y="207.6" width="88.0" height="26.0" fill="#5b9be8" fill-opacity="0.45" stroke="#5b9be8"/>
    <rect x="676.0" y="191.4" width="88.0" height="26.0" fill="#5b9be8" fill-opacity="0.45" stroke="#5b9be8"/>
    <rect x="716.0" y="175.1" width="88.0" height="26.0" fill="#5b9be8" fill-opacity="0.45" stroke="#5b9be8"/>
    <rect x="756.0" y="40" width="48.0" height="144.9" fill="#5b9be8" fill-opacity="0.7" stroke="#5b9be8"/>
    <text x="814.0" y="82" fill="currentColor">A holds where it ends: FOREVER</text>
    <text x="556" y="356" fill="currentColor">A walks east, booked piece by piece</text>
  </g>
  <g id="walker-b">
    <rect x="516.0" y="258.0" width="48.0" height="39.0" fill="none" stroke="#fe9e99" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="504.0" y="262" text-anchor="end" fill="currentColor">B first asks for 4.4–5.6 s: resHit finds A</text>
    <rect x="516.0" y="199.5" width="48.0" height="39.0" fill="#5cf58a" fill-opacity="0.55" stroke="#5cf58a" stroke-width="2"/>
    <text x="504.0" y="212" text-anchor="end" fill="currentColor">B crosses at 6.2 s, after A has passed</text>
  </g>
</svg>
