# The checks that run for a pull request and for a push to main.
#
# The job runs `mix check`, which runs the compiler, the formatter, Credo,
# Dialyzer, Doctor, ExDoc, ExUnit, mix_audit and Sobelow. It then runs the two
# npm commands, which check the types of the presenter script and run its tests.
# Last, it runs the browser tests with `mix test --only e2e`. `CLAUDE.md` gives
# the same list.
#
# The job runs on the versions of `.tool-versions`. The Nix shell gives those
# versions, and `.claude/hooks/session-start.sh` gives them to a remote session.
# Therefore each person, each session and this job give the same result. Keep the
# four places in agreement.

name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # The versions of `.tool-versions`.
  OTP_VERSION: "29.1"
  ELIXIR_VERSION: "1.20.4-otp-29"
  NODE_VERSION: "24.20.0"

jobs:
  check:
    name: Erlang/OTP 29, Elixir 1.20, Node 24
    runs-on: ubuntu-latest

    steps:
      - name: Read the repository
        uses: actions/checkout@v4

      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `_build` holds the PLT of Dialyzer, which `mix.exs` puts there. A change
      # to `mix.lock` gives a new key, and the tools then run against a new build.
      - name: Read the cache of the dependencies and of the build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Get the dependencies of the presenter script
        run: npm ci

      # Hex reports an advisory of a dependency in this output, and that output
      # is the more current signal. `docs/development.md` gives an example.
      - name: Get the dependencies
        run: mix deps.get

      - name: Run mix check
        run: mix check

      - name: Check the types of the presenter script
        run: npm run check

      - name: Run the tests of the presenter script
        run: npm test

      # The browser tests open each deck in the Chromium of the Playwright version
      # of `package-lock.json`. The option `--with-deps` installs the system
      # libraries of that browser, and `--only-shell` installs the headless
      # browser only, because the tests do not need a window.
      - name: Install the browser of the browser tests
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run the browser tests
        run: mix test --only e2e
