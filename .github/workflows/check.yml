# The checks that run for a pull request and for a push to main.
#
# Each check runs in its own job, and the jobs run in parallel. The slowest job
# gives the time of the workflow, and not the sum of the jobs. The list is the
# list of `CLAUDE.md`, and it covers each tool of `mix check`:
#
# - format: `mix format --check-formatted`
# - compile: `mix compile --warnings-as-errors`
# - credo: `mix credo`
# - dialyzer: `mix dialyzer`
# - test: `mix test`
# - e2e: `mix test --only e2e`, the browser tests
# - docs: `mix docs` and `mix doctor`
# - security: `mix sobelow`, `mix deps.audit` and the check of unused dependencies
# - presenter: `npm run check` and `npm test`
#
# The last job needs each other job, and it fails when one of them does not
# succeed. It has the name of the one job of the earlier workflow, so a branch
# protection rule that asks for that name still covers each check.
#
# The jobs run on the versions of `.tool-versions`. The Nix shell gives those
# versions, and `.claude/hooks/session-start.sh` gives them to a remote session.
# Therefore each person, each session and this workflow give the same result.
# Keep the four places in agreement.

name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # The versions of `.tool-versions`.
  OTP_VERSION: "29.1"
  ELIXIR_VERSION: "1.20.4-otp-29"
  NODE_VERSION: "24.20.0"

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-elixir
        with:
          cache: format
      - run: mix format --check-formatted

  compile:
    name: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-elixir
        with:
          cache: compile
      - run: mix compile --warnings-as-errors

  credo:
    name: credo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-elixir
        with:
          cache: credo
      - run: mix credo

  dialyzer:
    name: dialyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-elixir
        with:
          cache: dialyzer
      - run: mix dialyzer

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-elixir
        with:
          cache: test
      - run: mix test

  # The browser tests open each deck in the Chromium of the Playwright version of
  # `package-lock.json`. The option `--with-deps` installs the system libraries
  # of that browser, and `--only-shell` installs the headless browser only,
  # because the tests do not need a window.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - uses: ./.github/actions/setup-elixir
        with:
          cache: e2e
      - run: mix test --only e2e

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-elixir
        with:
          cache: docs
      - run: mix docs
      - run: mix doctor

  # `mix deps.unlock --check-unused` is the check of `unused_deps` in `mix check`.
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-elixir
        with:
          cache: security
      - run: mix sobelow --exit --skip
      - run: mix deps.audit
      - run: mix deps.unlock --check-unused

  # The presenter script needs Node only.
  presenter:
    name: presenter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  all:
    name: Erlang/OTP 29, Elixir 1.20, Node 24
    if: always()
    needs: [format, compile, credo, dialyzer, test, e2e, docs, security, presenter]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a check does not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "Each check succeeded."
