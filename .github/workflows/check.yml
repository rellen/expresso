# The checks that run for a pull request and for a push to main.
#
# The checks run in parallel jobs on Linux, so the slowest of them gives their
# time, and not the sum of the jobs. The list holds each command of "Build and
# test" in `CLAUDE.md`, and it covers each tool of `mix check`. It also runs
# `mix docs`, `mix doctor`, the check of unused dependencies and
# `mix expresso.gifs`:
#
# - format: `mix format --check-formatted`
# - lint: `mix compile --warnings-as-errors`, `mix credo`, `mix sobelow`,
#   `mix hex.audit`, the check of unused dependencies, `mix docs`,
#   `mix doctor` and `mix dialyzer`
# - test: `mix test`, in two partitions
# - e2e: `mix test --only e2e`, the browser tests, in three partitions
# - dependency: `mix test --only dependency`, the test of Expresso as a
#   dependency
# - presenter: `npm run check`, `npm run lint`, `npm run format:check` and
#   `npm test`
# - gifs: `mix expresso.gifs`, the GIFs and the stills of the example decks
#   of the guides and of the presenter pages
# - binary: `mix release expresso_cli_app` for Linux on x86_64 and on
#   aarch64, and `mix test --only release`, the tests of each binary
#
# No job runs on macOS, because a macOS runner costs more than a Linux runner.
# `docs/development/ci.md` tells how to check the project on a Mac.
#
# `.github/workflows/audit.yml` also runs `mix hex.audit` on main each day, so
# an advisory that Hex publishes after a merge fails a run of main.
#
# After a push to main, the job `media` puts the GIFs on the branch `media`,
# and the guides of `docs/` show them from there. The branch holds the GIFs of
# the last push only, so the history of main holds no GIF.
#
# After a push to main, the job `pages` also puts the site of `mix docs` on
# GitHub Pages, at https://rellen.github.io/expresso/. The job `lint` makes the
# site, so the site and the checks come from one build.
#
# `media` and `pages` start only when the last job succeeded. A push to main
# with a failed check therefore changes neither the GIFs nor the site. The site
# shows the GIFs of the branch `media`, so the two stay in agreement.
#
# A job compiles the project for one environment, so the tools that need the
# same build share one job. `lint` also runs Dialyzer, which needs the same
# build. With the PLT in the cache, Dialyzer takes approximately 30 seconds,
# and `lint` still finishes before the slowest job. The unit tests, the
# browser tests and the test of Expresso as a dependency run in jobs of their
# own, at the same time. The jobs `test` and `e2e` share the cache of the test
# build. `format` and `presenter` compile nothing, and
# they stay alone, so a defect in them shows in a few seconds.
#
# The last job needs each other job, and it fails when one of them does not
# succeed. It has the name of the one job of the earlier workflow, so a branch
# protection rule that asks for that name still covers each check.
#
# The jobs run on the versions of `.tool-versions`. The Nix shell gives those
# versions, and `.claude/hooks/session-start.sh` gives them to a remote session.
# Therefore each person, each session and this workflow give the same result.
# Keep the four places in agreement.

name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # The versions of `.tool-versions`.
  OTP_VERSION: "29.1"
  ELIXIR_VERSION: "1.20.4-otp-29"
  NODE_VERSION: "24.20.0"
  ZIG_VERSION: "0.16.0"
  # The version of D2 for `.github/actions/setup-graph-tools`, as the session
  # hook gives it.
  D2_VERSION: "0.7.1"

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir
        with:
          cache: format
      - run: mix format --check-formatted

  # The first step compiles the project. Each step after it runs also when a
  # step before it fails, so one run reports each defect, as `mix check` does.
  # `mix deps.unlock --check-unused` is the check of `unused_deps` in
  # `mix check`, and `mix docs` is its check of `ex_doc`. `mix hex.audit` fails
  # for a dependency with a security advisory or a retirement on Hex. The cache
  # of the job holds the PLT of Dialyzer, in `_build`.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir
        with:
          cache: lint
      - uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}
          cache: lint
      - run: mix compile --warnings-as-errors
      - if: ${{ !cancelled() }}
        run: mix credo
      - if: ${{ !cancelled() }}
        run: mix sobelow --exit --skip
      - if: ${{ !cancelled() }}
        run: mix hex.audit
      - if: ${{ !cancelled() }}
        run: mix deps.unlock --check-unused
      - if: ${{ !cancelled() }}
        run: mix docs
      - if: ${{ !cancelled() }}
        run: mix doctor
      - if: ${{ !cancelled() }}
        run: mix dialyzer
      # The site of `mix docs`, for the job `pages`. The step runs only when each
      # step before it succeeded.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc

  # Each job of the tests compiles the GIF encoder of `tools/` in the test
  # environment, so it needs Zig. The jobs run in parallel, and each one
  # reports its own result. The jobs `test` and `e2e` compile the same build,
  # so they share the cache `test`: each job reads the build of the commit
  # before, and compiles only the files that changed. The first job to finish
  # saves the build of its commit. The other jobs find the key, and they do not
  # save it again.
  #
  # `mix test --partitions` gives each test file to one of the partitions, and
  # `MIX_TEST_PARTITION` selects the partition of the job. The test of
  # `test/dependency/` is one test, so it has no partitions.
  test:
    name: test (${{ matrix.partition }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    env:
      MIX_TEST_PARTITION: ${{ matrix.partition }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir
        with:
          cache: test
      - uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}
          cache: test
      - run: mix test --partitions 2

  # The browser tests open each deck in the Chromium of the Playwright version of
  # `package-lock.json`. `.github/actions/setup-playwright` installs Node, the
  # packages and the headless browser, from a cache when it can.
  e2e:
    name: e2e (${{ matrix.partition }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    env:
      MIX_TEST_PARTITION: ${{ matrix.partition }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-playwright
      # A browser test renders each example deck, and two of them draw a graph.
      - uses: ./.github/actions/setup-graph-tools
        with:
          d2-version: ${{ env.D2_VERSION }}
      - uses: ./.github/actions/setup-elixir
        with:
          cache: test
      - uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}
          cache: test
      - run: mix test --only e2e --partitions 3

  # The tests that run a tool that draws a graph. The runner and a remote
  # session both run Ubuntu 24.04, so `apt-get` gives both the same version of
  # Graphviz. D2 comes from its release on GitHub, at the version of
  # `D2_VERSION`. `docs/development/graph-tools.md` gives the details.
  graph:
    name: graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-graph-tools
        with:
          d2-version: ${{ env.D2_VERSION }}
      - uses: ./.github/actions/setup-elixir
        with:
          cache: test
      - uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}
          cache: test
      - run: mix test --only graphviz --only d2

  # The test of `test/dependency/` makes a project that takes Expresso as a dev
  # dependency, and it fetches the dependencies of that project from Hex and
  # GitHub. The project is in `_build/dependency_project`, so the cache keeps
  # its build, and the next run compiles only the files that changed. The job
  # has its own cache: it finishes after the other jobs of the tests, so it
  # cannot save the cache `test`.
  dependency:
    name: dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir
        with:
          cache: dependency
      - uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}
          cache: dependency
      - run: mix test --only dependency

  # The presenter script needs Node only. Each step after the install runs
  # also when a step before it fails, so one run reports each defect, as
  # `mix check` does.
  presenter:
    name: presenter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: ${{ !cancelled() }}
        run: npm run lint
      - if: ${{ !cancelled() }}
        run: npm run format:check
      - if: ${{ !cancelled() }}
        run: npm test

  # The GIFs of the example decks. The job records them for each pull request
  # too, so an example that does not render fails the check. The artifact
  # `gifs` holds them, and a person can look at them before a merge.
  gifs:
    name: gifs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-playwright
      # Two example decks draw a graph.
      - uses: ./.github/actions/setup-graph-tools
        with:
          d2-version: ${{ env.D2_VERSION }}
      - uses: ./.github/actions/setup-elixir
        with:
          cache: gifs
      - uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}
          cache: gifs
      - run: mix expresso.gifs gifs
      - uses: actions/upload-artifact@v7
        with:
          name: gifs
          path: gifs/
          if-no-files-found: error

  # The binary that Burrito makes, for Linux on x86_64 and on aarch64. Each
  # target has a job on a runner of its architecture, so the job can run the
  # binary. Burrito needs Zig and xz, and the runner gives xz. The tests of
  # `test/release/` run the binary as a person does. The release uses the build
  # of prod, and the tests use the build of test, so a job compiles the project
  # two times. The binary holds the release, and the release takes approximately
  # 80 MB. Therefore the job removes the release after the build, and the cache
  # does not keep it. The job does not publish the binary: the runner discards
  # it after the tests.
  #
  # Each target has its own cache. The two jobs run at the same time, and with
  # one key only one of them can save its cache. No job makes a binary for
  # macOS.
  binary:
    name: binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux_x86
            runner: ubuntu-latest
          - target: linux_arm
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir
        with:
          cache: binary-${{ matrix.target }}
      - uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}
          cache: binary-${{ matrix.target }}
          burrito: "true"
      - run: |
          mix release expresso_cli_app --overwrite
          rm -rf _build/prod/rel
        env:
          MIX_ENV: prod
          BURRITO_TARGET: ${{ matrix.target }}
      - run: mix test --only release
        env:
          EXPRESSO_BINARY: burrito_out/expresso_cli_app_${{ matrix.target }}

  # Put the GIFs of a push to main on the branch `media`, as one commit with no
  # parent. The push replaces the branch, so the branch holds the GIFs of the
  # last push to main only. This job is the only job that can write to the
  # repository. It needs the last job, so it starts only when each check
  # succeeded. The artifact `gifs` stays available to each job of the run.
  media:
    name: media
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [all]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gifs
          path: gifs
      - name: Replace the branch media with the GIFs
        working-directory: gifs
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init --quiet --initial-branch=media
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit --quiet --message "docs: record the GIFs of the examples of ${GITHUB_SHA}"
          git push --force --quiet "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" media

  # Put the site of `mix docs` of a push to main on GitHub Pages. The job
  # `lint` made the site. This job needs the last job, so it starts only when
  # each check succeeded. The repository must have Pages on, with GitHub
  # Actions as the source: the token of a workflow cannot turn it on. A
  # deployment does not stop for a new push, so two deployments do not run at
  # the same time.
  pages:
    name: pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [all]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5

  all:
    name: Erlang/OTP 29, Elixir 1.20, Node 24
    if: always()
    needs: [format, lint, test, e2e, graph, dependency, presenter, gifs, binary]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a check does not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "Each check succeeded."
