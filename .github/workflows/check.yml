# The checks that run for a pull request and for a push to main.
#
# The checks run in parallel jobs. The slowest job, which is `dialyzer`, gives
# the time of the workflow, and not the sum of the jobs. The list is the list of
# `CLAUDE.md`, and it covers each tool of `mix check`:
#
# - format: `mix format --check-formatted`
# - lint: `mix compile --warnings-as-errors`, `mix credo`, `mix sobelow`,
#   `mix hex.audit`, the check of unused dependencies, `mix docs` and
#   `mix doctor`
# - dialyzer: `mix dialyzer`
# - test: `mix test` and `mix test --only e2e`, the browser tests
# - presenter: `npm run check` and `npm test`
# - gifs: `mix expresso.gifs`, the GIFs and the stills of the example decks
#   of the guides and of the README
# - release: `mix release expresso_cli_app` for Linux on x86_64 and on
#   aarch64, and `mix test --only release`, the tests of each binary
# - macos: `mix check` on macOS, which also runs the browser tests and the
#   release tests
#
# `.github/workflows/audit.yml` also runs `mix hex.audit` on main each day, so
# an advisory that Hex publishes after a merge fails a run of main.
#
# After a push to main, the job `media` puts the GIFs on the branch `media`,
# and the guides of `docs/` show them from there. The branch holds the GIFs of
# the last push only, so the history of main holds no GIF.
#
# After a push to main, the job `pages` also puts the site of `mix docs` on
# GitHub Pages, at https://rellen.github.io/expresso/. The job `lint` makes the
# site, so the site and the checks come from one build.
#
# A job compiles the project for one environment, so the tools that need the
# same build share one job. The tools of `lint` finish long before `dialyzer`,
# and a job for each tool compiled the project four times more with no gain in
# time. The unit tests and the browser tests share the build of the test
# environment in the same way. `format` and `presenter` compile nothing, and
# they stay alone, so a defect in them shows in a few seconds.
#
# The last job needs each other job, and it fails when one of them does not
# succeed. It has the name of the one job of the earlier workflow, so a branch
# protection rule that asks for that name still covers each check.
#
# The jobs run on the versions of `.tool-versions`. The Nix shell gives those
# versions, and `.claude/hooks/session-start.sh` gives them to a remote session.
# Therefore each person, each session and this workflow give the same result.
# Keep the four places in agreement.

name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # The versions of `.tool-versions`.
  OTP_VERSION: "29.1"
  ELIXIR_VERSION: "1.20.4-otp-29"
  NODE_VERSION: "24.20.0"
  ZIG_VERSION: "0.16.0"

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir
        with:
          cache: format
      - run: mix format --check-formatted

  # The first step compiles the project. Each step after it runs also when a
  # step before it fails, so one run reports each defect, as `mix check` does.
  # `mix deps.unlock --check-unused` is the check of `unused_deps` in
  # `mix check`, and `mix docs` is its check of `ex_doc`. `mix hex.audit` fails
  # for a dependency with a security advisory or a retirement on Hex.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir
        with:
          cache: lint
      - run: mix compile --warnings-as-errors
      - if: ${{ !cancelled() }}
        run: mix credo
      - if: ${{ !cancelled() }}
        run: mix sobelow --exit --skip
      - if: ${{ !cancelled() }}
        run: mix hex.audit
      - if: ${{ !cancelled() }}
        run: mix deps.unlock --check-unused
      - if: ${{ !cancelled() }}
        run: mix docs
      - if: ${{ !cancelled() }}
        run: mix doctor
      # The site of `mix docs`, for the job `pages`. The step runs only when each
      # step before it succeeded.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc

  dialyzer:
    name: dialyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir
        with:
          cache: dialyzer
      - run: mix dialyzer

  # The browser tests open each deck in the Chromium of the Playwright version of
  # `package-lock.json`. `.github/actions/setup-playwright` installs Node, the
  # packages and the headless browser, from a cache when it can. The browser
  # tests run also when a unit test fails.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-playwright
      - uses: ./.github/actions/setup-elixir
        with:
          cache: test
      - run: mix test
      - if: ${{ !cancelled() }}
        run: mix test --only e2e

  # The presenter script needs Node only.
  presenter:
    name: presenter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  # The GIFs of the example decks. The job records them for each pull request
  # too, so an example that does not render fails the check. The artifact
  # `gifs` holds them, and a person can look at them before a merge.
  gifs:
    name: gifs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-playwright
      - uses: ./.github/actions/setup-elixir
        with:
          cache: gifs
      - run: mix expresso.gifs gifs
      - uses: actions/upload-artifact@v7
        with:
          name: gifs
          path: gifs/
          if-no-files-found: error

  # The binary that Burrito makes, for Linux on x86_64 and on aarch64. Each
  # target has a job on a runner of its architecture, so the job can run the
  # binary. Burrito needs Zig and xz, and the runner gives xz. The tests of
  # `test/release/` run the binary as a person does. The release uses the build
  # of prod, and the tests use the build of test, so a job compiles the project
  # two times. The binary holds the release, and the release takes approximately
  # 80 MB. Therefore the job removes the release after the build, and the cache
  # does not keep it.
  #
  # Each target has its own cache. The two jobs run at the same time, and with
  # one key only one of them can save its cache. The macOS job makes the binary
  # of `macos_arm`, and no job makes the binary of `macos_x86`.
  release:
    name: release (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux_x86
            runner: ubuntu-latest
          - target: linux_arm
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir
        with:
          cache: release-${{ matrix.target }}
      - uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: |
          mix release expresso_cli_app --overwrite
          rm -rf _build/prod/rel
        env:
          MIX_ENV: prod
          BURRITO_TARGET: ${{ matrix.target }}
      - run: mix test --only release
        env:
          EXPRESSO_BINARY: burrito_out/expresso_cli_app_${{ matrix.target }}

  # `mix check` on macOS, on an arm64 runner. The other jobs run on Linux, so
  # this job makes sure that each tool of `mix check` runs on a Mac. `.check.exs`
  # makes the binary of the target `macos_arm`. Homebrew gives xz for Burrito,
  # and it gives `gtimeout` of GNU coreutils for the release tests. The job
  # removes the release after the run, so the cache does not keep it.
  macos:
    name: macos
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-playwright
      - uses: ./.github/actions/setup-elixir
        with:
          cache: macos
      - uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: brew install xz coreutils
      - run: mix check
      - run: rm -rf _build/prod/rel

  # Put the GIFs of a push to main on the branch `media`, as one commit with no
  # parent. The push replaces the branch, so the branch holds the GIFs of the
  # last push to main only. This job is the only job that can write to the
  # repository.
  media:
    name: media
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gifs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gifs
          path: gifs
      - name: Replace the branch media with the GIFs
        working-directory: gifs
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init --quiet --initial-branch=media
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit --quiet --message "docs: record the GIFs of the examples of ${GITHUB_SHA}"
          git push --force --quiet "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" media

  # Put the site of `mix docs` of a push to main on GitHub Pages. The job
  # `lint` made the site. The repository must have Pages on, with GitHub
  # Actions as the source: the token of a workflow cannot turn it on. A
  # deployment does not stop for a new push, so two deployments do not run at
  # the same time.
  pages:
    name: pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5

  all:
    name: Erlang/OTP 29, Elixir 1.20, Node 24
    if: always()
    needs: [format, lint, dialyzer, test, presenter, gifs, release, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a check does not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "Each check succeeded."
