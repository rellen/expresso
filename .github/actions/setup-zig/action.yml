# The setup of Zig for each job of `.github/workflows/check.yml` that compiles
# the project in dev or in test, or that makes the binary with Burrito. Zigler
# compiles the NIF of `tools/` with Zig in dev and in test.
#
# The jobs used mlugg/setup-zig before. That action targets Node.js 20, and
# GitHub gives a warning for each job that uses it. This action has no code of
# its own for Node.js: it uses the shell and actions/cache.
#
# `install.sh` downloads Zig from a community mirror, as mlugg/setup-zig did,
# and it makes sure of the SHA-256. The cache of GitHub keeps the installed
# Zig, so a run with a hit downloads nothing.
#
# Zig keeps the build of the wrapper of Burrito in its own cache. The cache of
# GitHub keeps that directory too, so the next run compiles less. The key holds
# the name of the job and `mix.lock`, and a job saves the cache only when no
# cache has its key. Therefore each job saves it one time for each version of
# the lockfile. A job that does not make the binary has its own key, so it
# does not save a cache without the wrapper of Burrito for the key of a binary.
#
# Burrito downloads the ERTS of the target, and on Linux a musl runtime. It
# keeps them in its own download cache, and the cache of GitHub keeps that
# directory too. Erlang gives the path of the directory, so a job runs
# `.github/actions/setup-elixir` before this action.

name: Set up Zig
description: Install Zig from a community mirror, and keep Zig, its build cache and the downloads of Burrito in the cache.

inputs:
  version:
    description: The version of Zig, which must agree with `.tool-versions`.
    required: true
  cache:
    description: The name of the job in the key of the build cache of Zig.
    required: true
  burrito:
    description: Keep the download cache of Burrito, for a job that makes the binary.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Read the cache of Zig
      id: zig
      uses: actions/cache@v6
      with:
        path: ${{ runner.tool_cache }}/zig/${{ inputs.version }}
        key: zig-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}

    - name: Install Zig
      if: steps.zig.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ZIG_DIR: ${{ runner.tool_cache }}/zig/${{ inputs.version }}
      run: '"${GITHUB_ACTION_PATH}/install.sh" "${VERSION}" "${ZIG_DIR}"'

    # Burrito calls `zig build` in `deps/burrito`. Without these variables, Zig
    # keeps its local cache in `deps`, and the cache of the dependencies grows.
    - name: Put Zig on the path
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ZIG_DIR: ${{ runner.tool_cache }}/zig/${{ inputs.version }}
        ZIG_CACHE: ${{ runner.temp }}/zig-cache
      run: |
        installed="$("${ZIG_DIR}/zig" version)"
        if [ "${installed}" != "${VERSION}" ]; then
          echo "The cache gave Zig ${installed}, and the job needs Zig ${VERSION}." >&2
          exit 1
        fi
        echo "${ZIG_DIR}" >> "${GITHUB_PATH}"
        echo "ZIG_GLOBAL_CACHE_DIR=${ZIG_CACHE}" >> "${GITHUB_ENV}"
        echo "ZIG_LOCAL_CACHE_DIR=${ZIG_CACHE}" >> "${GITHUB_ENV}"

    # Without a target, Zigler compiles the NIF of `tools/` for the CPU of the
    # runner, with each instruction of that CPU. The cache of `_build` then gives
    # the NIF to a runner with a different CPU. On 2026-10-01, a NIF from a runner
    # with AVX-512 stopped a runner without AVX-512 with SIGILL. These variables
    # give Zigler the baseline CPU of the architecture. Burrito does not read
    # them. A macOS runner keeps the CPU of the runner.
    - name: Give Zigler the baseline CPU
      if: runner.os == 'Linux'
      shell: bash
      env:
        ARCH: ${{ runner.arch }}
      run: |
        case "${ARCH}" in
          X64) echo "TARGET_ARCH=x86_64" >> "${GITHUB_ENV}" ;;
          ARM64) echo "TARGET_ARCH=aarch64" >> "${GITHUB_ENV}" ;;
          *) echo "The runner has the architecture ${ARCH}, and this action does not know it." >&2; exit 1 ;;
        esac
        echo "TARGET_OS=linux" >> "${GITHUB_ENV}"
        echo "TARGET_ABI=gnu" >> "${GITHUB_ENV}"

    # Each build of the binary adds the payload of its release to the build
    # cache, and the wrapper changes only with Burrito. A key for each run saved
    # the cache in each run, and the cache grew by each payload: on 2026-09-28,
    # one run saved 405 MB for linux_x86 and 234 MB for macos_arm. A key for each
    # lockfile saves the build of the wrapper, with one payload. The prefix
    # `zig-build` does not read the large caches of the key for each run.
    - name: Read the build cache of Zig
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/zig-cache
        key: zig-build-${{ inputs.cache }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-${{ hashFiles('mix.lock') }}
        restore-keys: |
          zig-build-${{ inputs.cache }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-

    # Zig does not remove old entries from its build cache, and a build of new
    # code adds entries. A build cache of more than 1 GB goes, and the job starts
    # a new one. mlugg/setup-zig did the same at 2 GB. On 2026-09-27, one build of
    # the binary gave a cache of 147 MB.
    - name: Limit the size of the build cache of Zig
      shell: bash
      env:
        ZIG_CACHE: ${{ runner.temp }}/zig-cache
      run: |
        if [ -d "${ZIG_CACHE}" ] && [ "$(du -sk "${ZIG_CACHE}" | cut -f 1)" -gt 1048576 ]; then
          echo "The build cache of Zig is larger than 1 GB, and the job removes it."
          rm -rf "${ZIG_CACHE}"
        fi

    # Burrito finds its download cache with `:filename.basedir(:user_cache, _)`:
    # `~/.cache/burrito_file_cache` on Linux, and
    # `~/Library/Caches/burrito_file_cache` on macOS. On 2026-09-28, the cache
    # held 59 MB of ERTS and 650 KB of musl for linux_x86. The key holds the
    # version of Erlang and `mix.lock`, which gives the version of Burrito, so
    # a job saves the cache one time for each version of the two.
    - name: Read the path of the download cache of Burrito
      if: inputs.burrito == 'true'
      id: burrito
      shell: bash
      run: |
        path="$(erl -noshell -eval 'io:format("~s", [filename:basedir(user_cache, "burrito_file_cache")]), halt().')"
        echo "path=${path}" >> "${GITHUB_OUTPUT}"

    - name: Read the download cache of Burrito
      if: inputs.burrito == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.burrito.outputs.path }}
        key: burrito-${{ runner.os }}-${{ runner.arch }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
