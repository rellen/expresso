# The setup of each Elixir job of `.github/workflows/check.yml` and of
# `.github/workflows/audit.yml`: Erlang and Elixir of `.tool-versions`, the
# cache of the dependencies and of the build, and `mix deps.get --check-locked`.
#
# Each job gives its own name to the cache. A job that compiles nothing, such
# as the formatter, then does not save a cache with no build for the other jobs.
#
# The key holds the commit, so each run saves the build of its commit, and the
# next run compiles only the files that changed after it. A run with no cache
# of its commit reads the latest cache of the same `mix.lock`, and then the
# latest cache of the job. A key with no commit saves one time only, and each
# later run then compiles each file that changed after that one save.

name: Set up Elixir
description: Install Erlang and Elixir, read the cache, and get the dependencies.

inputs:
  cache:
    description: The name of the cache of the job.
    required: true

runs:
  using: composite
  steps:
    # `strict` takes each version as it is. Without it, the action reads 29.1 as
    # the latest 29.1.x, and the jobs ran on OTP 29.1.1 after its release. Burrito
    # then found no ERTS for 29.1.1, and each place must give the same versions.
    - name: Install Erlang and Elixir
      uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ env.OTP_VERSION }}
        elixir-version: ${{ env.ELIXIR_VERSION }}
        version-type: strict

    # `_build` holds the PLT of Dialyzer, which `mix.exs` puts there. A change to
    # `mix.lock` gives a new key, and the tools then run against a new build.
    - name: Read the cache of the dependencies and of the build
      uses: actions/cache@v6
      with:
        path: |
          deps
          _build
        key: mix-${{ inputs.cache }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}-${{ github.sha }}
        restore-keys: |
          mix-${{ inputs.cache }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}-
          mix-${{ inputs.cache }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

    # `--check-locked` fails when `mix.lock` does not agree with `mix.exs`, so
    # each job uses the versions of the lockfile. Hex writes a warning for an
    # advisory here, and the job `lint` fails for it with `mix hex.audit`.
    - name: Get the dependencies
      shell: bash
      run: mix deps.get --check-locked
